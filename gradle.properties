# ParallelGC > G1GC for batch/throughput workloads like compilation; the capped Metaspace is what
# actually matters here — Mileway's daemon died mid-session on 768m with a comparable module count
# (2026-08-13), so this build gets the 1536m the sibling repos converged on rather than waiting to
# hit the same wall. -Xmx raised 3g → 4g to match them.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# The Kotlin compiler runs in a SEPARATE JVM that org.gradle.jvmargs above does NOT size. Kursi
# builds android + ios + jvm + wasmJs; leaving this at the default is what produced
# "OutOfMemoryError: Metaspace" on HireSignal's iOS targets, so it is set before it bites here.
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=2g

kotlin.incremental=true
# Incremental Kotlin/Native klib recompilation — meaningful on the ios targets.
kotlin.incremental.native=true

org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache (+ parallel config phase). problems=warn during bleeding-edge onboarding —
# some plugins (compose MP, AGP alpha) may not be fully CC-clean on every task; warn keeps the
# build green while still exercising CC. Isolated Projects deliberately NOT enabled (breaks AGP/KMP).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
kotlin.code.style=official
android.useAndroidX=true
